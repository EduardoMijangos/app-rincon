<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Buzón 📬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#fff0f3;color:#4a4e69;padding:16px;max-width:640px;margin:0 auto;line-height:1.5}
h1{color:#e63e78;margin:8px 0 14px}
.bar{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;padding:12px;border:2px solid #ffafcc;border-radius:12px;font-size:1rem}
button{padding:12px 18px;border:none;border-radius:12px;background:#e63e78;color:#fff;font-weight:600;font-size:1rem}
article{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
small{display:block;color:#777;margin-bottom:6px}
img{width:100%;border-radius:12px;margin-top:8px}
a{display:inline-block;margin-top:8px;color:#e63e78;font-weight:600}
#status{margin-bottom:10px;font-size:.9rem}
</style>
</head>
<body>
<h1>📬 Buzón</h1>
<form class="bar" id="f"><input id="key" type="password" placeholder="Tu ADMIN_KEY" autocomplete="current-password"><button>Entrar</button></form>
<p id="status"></p>
<div id="list"></div>
<script>
const $ = id => document.getElementById(id), urls = new Map();
$('key').value = localStorage.getItem('adminKey') || '';
const KIND = { photo: '📸 Foto', message: '✉️ Mensaje', mood: '🌈 Ánimo' };
async function load() {
  const key = $('key').value.trim(); if (!key) return;
  const h = { 'x-admin-key': key };
  try {
    const r = await fetch('/api/inbox?lite=1', { headers: h });
    if (r.status === 401) { $('status').textContent = 'Clave incorrecta.'; return; }
    if (!r.ok) throw 0;
    localStorage.setItem('adminKey', key);
    const items = await r.json();
    $('status').textContent = items.length ? `${items.length} elementos · se actualiza solo` : 'Aún no hay nada en el buzón.';
    const list = $('list'); list.innerHTML = '';
    for (const it of items) {
      const a = document.createElement('article'), s = document.createElement('small');
      s.textContent = new Date(it.at).toLocaleString('es-MX') + ' · ' + (KIND[it.type] || it.type); a.append(s);
      const t = it.type === 'mood' ? it.mood : it.type === 'photo' ? it.caption : it.text;
      if (t) { const p = document.createElement('p'); p.textContent = t; a.append(p); }
      if (it.hasImage) {
        const img = document.createElement('img'); img.alt = it.caption || 'Foto'; a.append(img);
        const dl = document.createElement('a'); dl.textContent = 'Descargar foto'; dl.download = 'foto-' + it.id + '.jpg'; a.append(dl);
        (async () => {
          if (!urls.has(it.id)) {
            const ir = await fetch('/api/inbox?img=' + encodeURIComponent(it.id), { headers: h });
            if (ir.ok) urls.set(it.id, URL.createObjectURL(await ir.blob()));
          }
          if (urls.has(it.id)) { img.src = urls.get(it.id); dl.href = urls.get(it.id); }
        })();
      }
      list.append(a);
    }
  } catch { $('status').textContent = 'No se pudo cargar. Revisa tu conexión.'; }
}
$('f').addEventListener('submit', e => { e.preventDefault(); load(); });
setInterval(() => { if (!document.hidden) load(); }, 30000);
load();
</script>
</body>
</html>
